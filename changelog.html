<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMC - Adições e Remoções</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --mc-gold: #ffb703;
      --mc-green: #4caf50;
      --mc-red: #e63946;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      color: #fff;
      font-family: 'Noto Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      background-color: #0d0d0d;
    }

    .bg-image {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('bg.jpg') no-repeat center center / cover;
      filter: blur(10px) brightness(0.4);
      transform: scale(1.05);
      z-index: -1;
    }

    .box {
      max-width: 650px;
      width: 100%;
      background: rgba(18, 18, 18, 0.9);
      border: 2px solid #444;
      border-radius: 12px;
      padding: 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      color: var(--mc-gold);
      margin-bottom: 25px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin: 15px 0 10px 0;
      color: #ddd;
    }

    ul {
      list-style: none;
      font-size: 0.9rem;
      line-height: 2;
      margin-bottom: 20px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ccc;
    }

    .badge-add { color: var(--mc-green); font-weight: bold; }
    .badge-remove { color: var(--mc-red); font-weight: bold; }
    .badge-fix { color: var(--mc-gold); font-weight: bold; }

    .back-btn {
      display: inline-block;
      color: var(--mc-gold);
      text-decoration: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      margin-top: 15px;
      transition: opacity 0.2s;
    }

    .back-btn:hover { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="bg-image"></div>

  <main class="box">
    <h1>NOTAS DE ATUALIZAÇÃO</h1>

    <div class="section-title">Versão 0.1.0 Beta</div>
    <ul>
      <li><span class="badge-add">[+]</span> Adicionados novos blocos de pedra.</li>
      <li><span class="badge-add">[+]</span> Novo Mob Lançado(Ghost).</li>
      <li><span class="badge-remove">[-]</span> Bloco de Energia.</li>
      <li><span class="badge-add">[+]</span> Ferramentas de Vignom. </li>
      <li><span class="badge-remove">[-]</span> Martelo.</li>
      <li><span class="badge-remove">[-]</span> Bussula de Vignom.</li>
    </ul>

    <a href="index.html" class="back-btn">← Voltar ao Início</a>
  </main>

</body>
</html>
