name: Atualizar Pagina de Updates MCC

on:
  push:
    paths:
      - 'Addon/**'       # Roda automaticamente quando colocar/alterar algo na pasta Addon
  workflow_dispatch:     # Permite rodar manualmente clicando no botão

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Executar gerador de updates
        run: python gerar_updates.py

      - name: Enviar alteracao para o GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add MegaCastleCraftUpdates.html
          git commit -m "Auto-update: Atualizado MegaCastleCraftUpdates.html [skip ci]" || exit 0
          git push

